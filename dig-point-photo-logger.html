<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Dig Point Photo Logger</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    :root {
      color-scheme: light dark;
      --bg: #101214;
      --panel: #1a1e22;
      --text: #f2f4f5;
      --muted: #aeb7bf;
      --accent: #2f80ed;
      --danger: #c0392b;
      --border: #343a40;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    header {
      padding: 14px 16px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    header h1 {
      margin: 0;
      font-size: 1.25rem;
    }

    header p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: .9rem;
    }

    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 12px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 10px;
    }

    button, .capture-label {
      min-height: 48px;
      border: 0;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }

    .primary, .capture-label {
      background: var(--accent);
      color: white;
    }

    .secondary {
      background: #363d45;
      color: white;
    }

    .danger {
      background: var(--danger);
      color: white;
    }

    input[type="file"] {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    input[type="text"], textarea {
      width: 100%;
      border: 1px solid var(--border);
      background: #111418;
      color: var(--text);
      border-radius: 9px;
      padding: 11px;
      font-size: 1rem;
      margin-top: 6px;
    }

    label.text-label {
      display: block;
      margin: 10px 0;
      font-weight: 600;
    }

    #status {
      padding: 9px 10px;
      border-radius: 8px;
      background: #111418;
      color: var(--muted);
      margin-top: 10px;
      min-height: 40px;
    }

    #preview {
      display: none;
      width: 100%;
      max-height: 320px;
      object-fit: contain;
      border-radius: 10px;
      margin-top: 10px;
      background: #000;
    }

    #map {
      height: 420px;
      border-radius: 10px;
      overflow: hidden;
    }

    .point {
      border-top: 1px solid var(--border);
      padding: 12px 0;
      display: grid;
      grid-template-columns: 90px 1fr;
      gap: 12px;
      align-items: start;
    }

    .point:first-child {
      border-top: 0;
    }

    .thumb {
      width: 90px;
      height: 90px;
      object-fit: cover;
      border-radius: 8px;
      background: #000;
    }

    .point-title {
      font-weight: 700;
      margin-bottom: 4px;
    }

    .small {
      font-size: .87rem;
      color: var(--muted);
      overflow-wrap: anywhere;
    }

    .point-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .point-actions button, .point-actions a {
      min-height: 36px;
      padding: 7px 10px;
      border-radius: 7px;
      border: 0;
      font-size: .86rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
    }

    .empty {
      color: var(--muted);
      text-align: center;
      padding: 20px 4px;
    }

    @media (max-width: 520px) {
      .buttons { grid-template-columns: 1fr; }
      #map { height: 350px; }
    }
  </style>
</head>

<body>
<header>
  <h1>Dig Point Photo Logger</h1>
  <p>Photo + GPS coordinates + timestamp + map pin</p>
</header>

<main>
  <section class="card">
    <label class="text-label">
      Point name / ID
      <input id="pointName" type="text" placeholder="Example: Dig Point 12">
    </label>

    <label class="text-label">
      Notes
      <textarea id="notes" rows="2" placeholder="Optional notes"></textarea>
    </label>

    <div class="buttons">
      <label class="capture-label" for="photoInput">📷 Take Photo</label>
      <button id="gpsBtn" class="secondary" type="button">📍 Refresh GPS</button>
    </div>

    <input id="photoInput" type="file" accept="image/*" capture="environment">

    <img id="preview" alt="Selected photo preview">

    <div id="status">Ready. Take a photo to begin.</div>

    <div style="margin-top:10px">
      <button id="saveBtn" class="primary" type="button" style="width:100%" disabled>
        Save Dig Point
      </button>
    </div>
  </section>

  <section class="card">
    <div id="map"></div>
  </section>

  <section class="card">
    <div class="buttons">
      <button id="exportBtn" class="secondary" type="button">Export CSV</button>
      <button id="clearBtn" class="danger" type="button">Delete All Points</button>
    </div>
  </section>

  <section class="card">
    <h2 style="margin-top:0;font-size:1.1rem">Saved Points</h2>
    <div id="log"></div>
  </section>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
(() => {
  const DB_NAME = "digPointLogger";
  const STORE = "points";

  const photoInput = document.getElementById("photoInput");
  const preview = document.getElementById("preview");
  const status = document.getElementById("status");
  const saveBtn = document.getElementById("saveBtn");
  const gpsBtn = document.getElementById("gpsBtn");
  const pointName = document.getElementById("pointName");
  const notes = document.getElementById("notes");
  const log = document.getElementById("log");

  let selectedPhoto = null;
  let currentPosition = null;
  let db;
  let markers = [];

  const map = L.map("map").setView([37.0, -120.0], 7);

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 20,
    attribution: "&copy; OpenStreetMap contributors"
  }).addTo(map);

  function setStatus(message) {
    status.textContent = message;
  }

  function openDb() {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open(DB_NAME, 1);

      request.onupgradeneeded = e => {
        const database = e.target.result;
        if (!database.objectStoreNames.contains(STORE)) {
          database.createObjectStore(STORE, { keyPath: "id", autoIncrement: true });
        }
      };

      request.onsuccess = e => {
        db = e.target.result;
        resolve(db);
      };

      request.onerror = () => reject(request.error);
    });
  }

  function requestGPS() {
    return new Promise((resolve, reject) => {
      if (!navigator.geolocation) {
        reject(new Error("This browser does not support GPS/geolocation."));
        return;
      }

      setStatus("Getting GPS location…");

      navigator.geolocation.getCurrentPosition(
        pos => {
          currentPosition = {
            latitude: pos.coords.latitude,
            longitude: pos.coords.longitude,
            accuracy: pos.coords.accuracy
          };

          setStatus(
            `GPS ready: ${currentPosition.latitude.toFixed(6)}, ` +
            `${currentPosition.longitude.toFixed(6)} ` +
            `(accuracy ±${Math.round(currentPosition.accuracy)} m)`
          );

          saveBtn.disabled = !selectedPhoto;
          resolve(currentPosition);
        },
        err => {
          currentPosition = null;
          saveBtn.disabled = true;
          reject(new Error(
            err.code === 1
              ? "Location permission was denied."
              : "Could not get GPS location. Try again outdoors."
          ));
        },
        {
          enableHighAccuracy: true,
          timeout: 20000,
          maximumAge: 0
        }
      );
    });
  }

  photoInput.addEventListener("change", async () => {
    const file = photoInput.files && photoInput.files[0];
    if (!file) return;

    selectedPhoto = file;
    preview.src = URL.createObjectURL(file);
    preview.style.display = "block";
    saveBtn.disabled = true;

    try {
      await requestGPS();
    } catch (e) {
      setStatus(e.message);
    }
  });

  gpsBtn.addEventListener("click", async () => {
    try {
      await requestGPS();
    } catch (e) {
      setStatus(e.message);
    }
  });

  saveBtn.addEventListener("click", async () => {
    if (!selectedPhoto || !currentPosition) {
      setStatus("A photo and GPS location are required.");
      return;
    }

    saveBtn.disabled = true;
    setStatus("Saving point…");

    const record = {
      name: pointName.value.trim() || "Dig Point",
      notes: notes.value.trim(),
      timestamp: new Date().toISOString(),
      latitude: currentPosition.latitude,
      longitude: currentPosition.longitude,
      accuracy: currentPosition.accuracy,
      photoName: selectedPhoto.name || "photo.jpg",
      photoType: selectedPhoto.type || "image/jpeg",
      photo: selectedPhoto
    };

    const tx = db.transaction(STORE, "readwrite");
    tx.objectStore(STORE).add(record);

    tx.oncomplete = async () => {
      setStatus("Point saved.");
      selectedPhoto = null;
      currentPosition = null;
      photoInput.value = "";
      preview.src = "";
      preview.style.display = "none";
      pointName.value = "";
      notes.value = "";
      saveBtn.disabled = true;
      await render();
    };

    tx.onerror = () => {
      setStatus("Could not save point. Browser storage may be full.");
      saveBtn.disabled = false;
    };
  });

  function getAllPoints() {
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, "readonly");
      const req = tx.objectStore(STORE).getAll();

      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  function deletePoint(id) {
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, "readwrite");
      tx.objectStore(STORE).delete(id);
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
  }

  async function render() {
    const points = await getAllPoints();
    points.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

    markers.forEach(m => map.removeLayer(m));
    markers = [];
    log.innerHTML = "";

    if (!points.length) {
      log.innerHTML = '<div class="empty">No points saved yet.</div>';
      return;
    }

    const bounds = [];

    points.forEach(point => {
      const marker = L.marker([point.latitude, point.longitude])
        .addTo(map)
        .bindPopup(
          `<strong>${escapeHtml(point.name)}</strong><br>` +
          `${new Date(point.timestamp).toLocaleString()}<br>` +
          `${point.latitude.toFixed(6)}, ${point.longitude.toFixed(6)}`
        );

      markers.push(marker);
      bounds.push([point.latitude, point.longitude]);

      const row = document.createElement("div");
      row.className = "point";

      const img = document.createElement("img");
      img.className = "thumb";
      img.alt = `Photo for ${point.name}`;
      img.src = URL.createObjectURL(point.photo);

      const body = document.createElement("div");

      const title = document.createElement("div");
      title.className = "point-title";
      title.textContent = point.name;

      const detail = document.createElement("div");
      detail.className = "small";
      detail.innerHTML =
        `${new Date(point.timestamp).toLocaleString()}<br>` +
        `Lat: ${point.latitude.toFixed(6)}<br>` +
        `Lon: ${point.longitude.toFixed(6)}<br>` +
        `GPS accuracy: ±${Math.round(point.accuracy)} m`;

      if (point.notes) {
        const note = document.createElement("div");
        note.className = "small";
        note.style.marginTop = "6px";
        note.textContent = point.notes;
        body.append(title, detail, note);
      } else {
        body.append(title, detail);
      }

      const actions = document.createElement("div");
      actions.className = "point-actions";

      const mapLink = document.createElement("a");
      mapLink.className = "secondary";
      mapLink.href =
        `https://www.google.com/maps/search/?api=1&query=${point.latitude},${point.longitude}`;
      mapLink.target = "_blank";
      mapLink.rel = "noopener";
      mapLink.textContent = "Open in Maps";

      const photoLink = document.createElement("a");
      photoLink.className = "secondary";
      photoLink.href = URL.createObjectURL(point.photo);
      photoLink.download = `${point.name.replace(/[^\w-]+/g, "_")}_${point.id}.jpg`;
      photoLink.textContent = "Save Photo";

      const zoomBtn = document.createElement("button");
      zoomBtn.className = "secondary";
      zoomBtn.type = "button";
      zoomBtn.textContent = "Show Pin";
      zoomBtn.addEventListener("click", () => {
        map.setView([point.latitude, point.longitude], 19);
        marker.openPopup();
        document.getElementById("map").scrollIntoView({ behavior: "smooth" });
      });

      const deleteBtn = document.createElement("button");
      deleteBtn.className = "danger";
      deleteBtn.type = "button";
      deleteBtn.textContent = "Delete";
      deleteBtn.addEventListener("click", async () => {
        if (confirm(`Delete "${point.name}"?`)) {
          await deletePoint(point.id);
          await render();
        }
      });

      actions.append(zoomBtn, mapLink, photoLink, deleteBtn);
      body.append(actions);

      row.append(img, body);
      log.append(row);
    });

    if (bounds.length === 1) {
      map.setView(bounds[0], 18);
    } else {
      map.fitBounds(bounds, { padding: [25, 25] });
    }
  }

  document.getElementById("exportBtn").addEventListener("click", async () => {
    const points = await getAllPoints();

    if (!points.length) {
      alert("There are no points to export.");
      return;
    }

    const rows = [
      ["ID", "Name", "Timestamp", "Latitude", "Longitude", "AccuracyMeters", "Notes"]
    ];

    points
      .sort((a,b) => new Date(a.timestamp) - new Date(b.timestamp))
      .forEach(p => rows.push([
        p.id,
        p.name,
        p.timestamp,
        p.latitude,
        p.longitude,
        p.accuracy,
        p.notes
      ]));

    const csv = rows
      .map(row => row.map(csvEscape).join(","))
      .join("\n");

    const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `dig-points-${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  });

  document.getElementById("clearBtn").addEventListener("click", () => {
    if (!confirm("Delete ALL saved points and photos from this browser?")) return;

    const tx = db.transaction(STORE, "readwrite");
    tx.objectStore(STORE).clear();

    tx.oncomplete = async () => {
      setStatus("All saved points deleted.");
      await render();
    };
  });

  function csvEscape(value) {
    const s = String(value ?? "");
    return `"${s.replace(/"/g, '""')}"`;
  }

  function escapeHtml(value) {
    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  openDb()
    .then(render)
    .catch(() => setStatus("Could not open browser storage."));
})();
</script>
</body>
</html>
